name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AIRFLOW_VERSION: "3.3.1"

jobs:
  pytest:
    name: pytest (Airflow 3.3.1, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Airflow is deliberately absent from requirements.txt - in the real
      # deployment it comes from the image. It is installed here so that
      # tests/test_dag_integrity.py parses the DAG instead of skipping itself:
      # without it six of the thirty-seven tests disappear in silence and CI
      # would stay green while the DAG was broken. The constraints file is what
      # makes an Airflow install reproducible.
      - name: Install Airflow and project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "apache-airflow==${AIRFLOW_VERSION}" -r requirements.txt \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-3.12.txt"

      - name: Installed versions
        run: pip list | grep -Ei "apache-airflow|holidays|psycopg|requests|pytest" || true

      - name: Run the test suite
        run: python -m pytest -q